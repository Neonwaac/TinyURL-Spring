<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/base :: baseHead('Enlaces - TinyURL')}"></th:block>
	<style>
		.page-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1.5rem;
			flex-wrap: wrap;
			gap: 1rem;
		}

		.page-title {
			font-size: 1.75rem;
			font-weight: 700;
			color: var(--text-primary);
		}

		.page-title span {
			color: var(--accent-primary);
		}

		.stats-summary {
			display: flex;
			gap: 1.5rem;
		}

		.stat-item {
			text-align: right;
		}

		.stat-value {
			font-size: 1.5rem;
			font-weight: 700;
			color: var(--accent-primary);
		}

		.stat-label {
			font-size: 0.75rem;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		/* Card */
		.card {
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 12px;
			overflow: hidden;
		}

		.card-header {
			background: var(--bg-secondary);
			padding: 1rem 1.25rem;
			font-weight: 600;
			font-size: 0.9rem;
			color: var(--text-primary);
			border-bottom: 1px solid var(--border-color);
			display: flex;
			align-items: center;
			gap: 0.625rem;
		}

		.card-header svg {
			width: 18px;
			height: 18px;
			color: var(--accent-primary);
		}

		.card-body {
			padding: 0;
		}

		/* Table */
		.table-wrapper {
			overflow-x: auto;
		}

		.data-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.875rem;
		}

		.data-table thead {
			background: var(--bg-primary);
		}

		.data-table th {
			padding: 0.875rem 1rem;
			text-align: left;
			font-weight: 600;
			color: var(--text-muted);
			text-transform: uppercase;
			font-size: 0.7rem;
			letter-spacing: 0.5px;
			border-bottom: 1px solid var(--border-color);
		}

		.data-table td {
			padding: 0.875rem 1rem;
			border-bottom: 1px solid var(--border-color);
			vertical-align: middle;
		}

		.data-table tbody tr {
			transition: background 0.15s ease;
		}

		.data-table tbody tr:hover {
			background: var(--bg-card-hover);
		}

		.data-table tbody tr:last-child td {
			border-bottom: none;
		}

		/* Badge */
		.badge {
			display: inline-block;
			padding: 0.25rem 0.625rem;
			border-radius: 4px;
			font-size: 0.75rem;
			font-weight: 600;
		}

		.badge-code {
			background: rgba(200, 255, 0, 0.1);
			color: var(--accent-primary);
			font-family: 'SF Mono', 'Consolas', monospace;
		}

		.badge-clicks {
			background: rgba(74, 222, 128, 0.1);
			color: var(--accent-green);
			min-width: 40px;
			text-align: center;
		}

		.badge-cache {
			background: rgba(96, 165, 250, 0.1);
			color: var(--accent-blue);
			text-align: center;
		}

		.badge-cache.cache-no {
			background: rgba(248, 113, 113, 0.1);
			color: var(--accent-red);
		}

		/* Links */
		.short-link {
			color: var(--accent-primary);
			text-decoration: none;
			font-weight: 500;
			font-family: 'SF Mono', 'Consolas', monospace;
			font-size: 0.8rem;
		}

		.short-link:hover {
			text-decoration: underline;
		}

		.original-url {
			white-space: normal;
			word-break: break-all;
			display: block;
		}

		.original-url a {
			color: var(--text-muted);
			text-decoration: none;
			font-size: 0.8rem;
		}

		.original-url a:hover {
			color: var(--text-secondary);
		}

		/* Thumbnail */
		.img-thumbnail {
			width: 40px;
			height: 40px;
			object-fit: cover;
			border-radius: 6px;
			border: 1px solid var(--border-color);
			background: var(--bg-primary);
		}

		.no-img {
			color: var(--text-muted);
			font-size: 0.75rem;
		}

		/* Description */
		.description {
			color: var(--text-secondary);
			font-size: 0.8rem;
			max-width: 140px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		/* Button */
		.btn-outline {
			padding: 0.375rem 0.75rem;
			background: transparent;
			border: 1px solid var(--border-color);
			border-radius: 6px;
			color: var(--text-secondary);
			font-size: 0.75rem;
			font-weight: 500;
			cursor: pointer;
			text-decoration: none;
			transition: all 0.2s ease;
			display: inline-flex;
			align-items: center;
			gap: 0.375rem;
		}

		.btn-outline:hover {
			background: var(--accent-primary);
			border-color: var(--accent-primary);
			color: #000000;
		}

		.btn-outline svg {
			width: 14px;
			height: 14px;
		}

		/* Empty State */
		.empty-state {
			text-align: center;
			padding: 4rem 1rem;
			color: var(--text-muted);
		}

		.empty-icon {
			width: 48px;
			height: 48px;
			margin: 0 auto 1rem;
			opacity: 0.3;
		}

		.empty-title {
			font-size: 1rem;
			font-weight: 600;
			color: var(--text-secondary);
			margin-bottom: 0.5rem;
		}

		.empty-desc {
			font-size: 0.85rem;
		}

		/* Responsive */
		@media (max-width: 768px) {
			.page-header {
				flex-direction: column;
				align-items: flex-start;
			}

			.stats-summary {
				width: 100%;
				justify-content: flex-start;
			}

			.stat-item {
				text-align: left;
			}

			.data-table th,
			.data-table td {
				padding: 0.75rem;
			}

			.description {
				max-width: 80px;
			}
		}
	</style>
</head>
<body>
	<div th:replace="~{fragments/base :: navbar('links')}"></div>
	<div class="container">
		<div class="page-header">
			<h1 class="page-title">Enlaces <span>Generados</span></h1>
			<div class="stats-summary">
				<div class="stat-item">
					<div class="stat-value" th:text="${#lists.size(links)}"></div>
					<div class="stat-label">Total Enlaces</div>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="card-header">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
					<path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
					<path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
				</svg>
				Lista de Enlaces
			</div>
			<div class="card-body">
				<div class="table-wrapper">
					<table class="data-table">
						<thead>
							<tr>
								<th>Codigo</th>
								<th>Enlace Corto</th>
								<th>URL Original</th>
								<th>Clicks</th>
								<th>Imagen</th>
								<th>Descripcion</th>
								<th>Cacheado</th>
								<th>Accion</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="link : ${links}">
								<td>
									<span class="badge badge-code" th:text="${link.code}"></span>
								</td>
								<td>
									<a class="short-link"
									   th:href="${baseUrl + '/r/' + link.code}"
									   th:text="${baseUrl + '/r/' + link.code}"
									   target="_blank"></a>
								</td>
								<td>
									<div class="original-url" th:title="${link.originalUrl}">
										<a th:href="${link.originalUrl}" target="_blank" th:text="${link.originalUrl}"></a>
									</div>
								</td>
								<td>
									<span class="badge badge-clicks" th:text="${link.clicks}"></span>
								</td>
								<td>
									<img th:if="${!#strings.isEmpty(link.image)}" th:src="${link.image}" alt="Preview" class="img-thumbnail">
									<span class="no-img" th:if="${#strings.isEmpty(link.image)}">Sin imagen disponible</span>
								</td>
								<td>
									<span class="description"
										  th:text="${#strings.isEmpty(link.description) ? 'Sin descripcion' : link.description}"></span>
								</td>
								<td>
									<span class="badge badge-cache"
										  th:classappend="${link.cached} ? ' cache-yes' : ' cache-no'"
										  th:text="${link.cached ? 'SI' : 'NO'}"></span>
								</td>
								<td>
									<a th:href="${baseUrl + '/r/' + link.code}" class="btn-outline" target="_blank">
										<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
											<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
											<polyline points="15,3 21,3 21,9"/>
											<line x1="10" y1="14" x2="21" y2="3"/>
										</svg>
										Visitar
									</a>
									<a class="btn-outline" th:href="@{/links/{code}/edit(code=${link.code})}">
										<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
											<path d="M12 20h9"/>
											<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
										</svg>
										Editar
									</a>
									<form th:action="@{/delete/{code}(code=${link.code})}" method="post">
										<button type="submit" class="btn-outline" onclick="return confirm('Deseas eliminar este enlace? Esta accion no se puede deshacer.');">
											<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
												<polyline points="3 6 5 6 21 6"/>
												<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
												<path d="M10 11v6"/>
												<path d="M14 11v6"/>
												<path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
											</svg>
											Eliminar
										</button>
									</form>
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(links)}">
								<td colspan="8">
									<div class="empty-state">
										<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
											<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
											<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
										</svg>
										<p class="empty-title">Sin enlaces</p>
										<p class="empty-desc">No hay enlaces creados aun. Crea tu primer enlace corto.</p>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<th:block th:replace="~{fragments/base :: menuScript}"></th:block>
</body>
</html>
