<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/base :: baseHead('Editar - TinyURL')}"></th:block>
	<style>
		.page-header {
			margin-bottom: 2rem;
			text-align: center;
		}

		.page-title {
			font-size: 1.75rem;
			font-weight: 700;
			color: var(--text-primary);
			margin-bottom: 0.5rem;
		}

		.page-title span {
			color: var(--accent-primary);
		}

		.page-subtitle {
			color: var(--text-muted);
			font-size: 0.9rem;
		}

		/* Alerts */
		.alert {
			max-width: 520px;
			margin: 0 auto 1.5rem;
			padding: 0.875rem 1rem;
			border-radius: 8px;
			font-size: 0.875rem;
			font-weight: 500;
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.alert svg {
			width: 18px;
			height: 18px;
			flex-shrink: 0;
		}

		.alert-danger {
			background: rgba(248, 113, 113, 0.1);
			border: 1px solid rgba(248, 113, 113, 0.3);
			color: #f87171;
		}

		/* Card */
		.card {
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 12px;
			overflow: hidden;
			max-width: 520px;
			margin: 0 auto;
		}

		.card-header {
			background: var(--bg-secondary);
			padding: 1rem 1.25rem;
			font-weight: 600;
			font-size: 0.9rem;
			color: var(--text-primary);
			border-bottom: 1px solid var(--border-color);
			display: flex;
			align-items: center;
			gap: 0.625rem;
		}

		.card-header svg {
			width: 18px;
			height: 18px;
			color: var(--accent-primary);
		}

		.card-body {
			padding: 1.5rem 1.25rem;
		}

		/* Form */
		.form-group {
			margin-bottom: 1.25rem;
		}

		.form-group:last-of-type {
			margin-bottom: 1.5rem;
		}

		.form-label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 500;
			color: var(--text-secondary);
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.form-control {
			width: 100%;
			padding: 0.75rem 1rem;
			background: var(--bg-input);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			color: var(--text-primary);
			font-size: 0.9rem;
			transition: all 0.2s ease;
			outline: none;
		}

		.form-control::placeholder {
			color: var(--text-muted);
		}

		.form-control:focus {
			border-color: var(--accent-primary);
			background: var(--bg-primary);
		}

		textarea.form-control {
			resize: vertical;
			min-height: 70px;
		}

		.is-invalid {
			border-color: var(--accent-red);
		}

		.field-error {
			margin-top: 0.5rem;
			color: var(--accent-red);
			font-size: 0.8rem;
		}

		/* Buttons */
		.btn-primary {
			width: 100%;
			padding: 0.875rem 1.5rem;
			background: var(--accent-primary);
			border: none;
			border-radius: 8px;
			color: #000000;
			font-size: 0.875rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
		}

		.btn-primary:hover {
			background: #d4ff33;
			transform: translateY(-1px);
		}

		.btn-primary:active {
			transform: translateY(0);
		}

		.btn-primary svg {
			width: 18px;
			height: 18px;
		}

		.btn-outline {
			padding: 0.8rem;
            margin-top: 0.8rem;
            width: 100%;
			background: transparent;
			border: 1px solid var(--border-color);
			border-radius: 6px;
			color: var(--text-secondary);
			font-size: 0.75rem;
			font-weight: 500;
			cursor: pointer;
			text-decoration: none;
			transition: all 0.2s ease;
			display: inline-flex;
			align-items: center;
            text-align: center;
            justify-content: center;
			gap: 0.375rem;
		}

		.btn-outline:hover {
			background: var(--accent-primary);
			border-color: var(--accent-primary);
			color: #000000;
		}

		.btn-outline svg {
			width: 14px;
			height: 14px;
		}
	</style>
</head>
<body>
	<div th:replace="~{fragments/base :: navbar('links')}"></div>
	<div class="container">
		<div class="page-header">
			<h1 class="page-title">Editar <span>Enlace</span></h1>
			<p class="page-subtitle" th:text="${originalUrl}"></p>
		</div>

		<div class="card">
			<div class="card-header">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<circle cx="12" cy="12" r="10"/>
					<line x1="12" y1="8" x2="12" y2="16"/>
					<line x1="8" y1="12" x2="16" y2="12"/>
				</svg>
				Actualizar metadata
			</div>
			<div class="card-body">
				<form th:action="@{/links/{code}/edit(code=${code})}" th:object="${linkEditForm}" method="post">
					<div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<circle cx="12" cy="12" r="10"/>
							<line x1="15" y1="9" x2="9" y2="15"/>
							<line x1="9" y1="9" x2="15" y2="15"/>
						</svg>
						Por favor revisa los campos resaltados antes de continuar.
					</div>
					<div class="form-group">
						<label for="image" class="form-label">URL de Imagen</label>
						<input type="url"
								   class="form-control"
								   th:classappend="${#fields.hasErrors('image')} ? ' is-invalid' : ''"
								   id="image"
								   th:field="*{image}"
								   placeholder="https://ejemplo.com/imagen.jpg">
						<div class="field-error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
					</div>
					<div class="form-group">
						<label for="description" class="form-label">Descripcion</label>
						<textarea class="form-control"
								  th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''"
								  id="description"
								  th:field="*{description}"
								  rows="2"
								  placeholder="Breve descripcion del enlace"></textarea>
						<div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
					</div>
					<button type="submit" class="btn-primary">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<path d="M12 20h9"/>
							<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
						</svg>
						Guardar cambios
					</button>
				</form>
				<div>
					<a class="btn-outline" th:href="@{/links}">Cancelar</a>
				</div>
			</div>
		</div>
	</div>

	<th:block th:replace="~{fragments/base :: menuScript}"></th:block>
</body>
</html>
